<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentMaster Pro - Unified Rental System</title>
    <meta
      name="description"
      content="Unified Rental Property Management System"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="RentMaster" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/assets/icon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/assets/icon-512x512.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/assets/icon-192x192.png"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
      // Configuration from Netlify environment variables
      window.appConfig = {
        firebase: {
          apiKey: "AIzaSyDTyvem4AV1deCh5WzG20NzR0fOBPQ2qjc",
          authDomain: "rentmasterpro-45672.firebaseapp.com",
          databaseURL:
            "https://rentmasterpro-45672-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "rentmasterpro-45672",
          storageBucket: "rentmasterpro-45672.firebasestorage.app",
          messagingSenderId: "970817206915",
          appId: "1:970817206915:web:10ffa2182b9f7ac7ef39b6",
          measurementId: "G-QRF9V9LLLY",
        },
        fcm: {
          vapidKey:
            "BOie5s_MUJ-gWc2HLWxUN5cgdDXrQ-4XX4Qffo41KBIM6gSmoYKzLVoWFUFrs5XSaG4D9upsf2VXCwYmDi27eII",
        },
      };
    </script>
  </head>
  <body>
    <div class="container">
      <div id="login-screen">
        <div class="login-card">
          <div class="login-header">
            <i data-lucide="home" class="login-icon"></i>
            <h2>RentMaster Pro</h2>
            <p class="login-subtitle">Unified Rental Management System</p>
          </div>
          <div class="login-form">
            <div class="input-group">
              <i data-lucide="user" class="input-icon"></i>
              <input type="text" id="user-id" placeholder="Login ID" />
            </div>
            <div class="input-group">
              <i data-lucide="lock" class="input-icon"></i>
              <input type="password" id="user-pass" placeholder="Password" />
            </div>
            <button
              class="btn btn-owner"
              style="width: 100%"
              onclick="processLogin()"
            >
              <i
                data-lucide="log-in"
                style="width: 18px; height: 18px; margin-right: 8px"
              ></i>
              Login
            </button>
            <p class="login-hint">Master: master/admin</p>
          </div>
        </div>
      </div>

      <div id="master-view" class="content">
        <header
          style="margin: -25px -25px 20px -25px; background: var(--master)"
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <i data-lucide="shield-check" style="width: 24px; height: 24px"></i>
            <strong>Master Admin Console</strong>
          </div>
          <button
            class="btn"
            style="background: rgba(255, 255, 255, 0.2); color: white"
            onclick="location.reload()"
          >
            <i
              data-lucide="log-out"
              style="width: 16px; height: 16px; margin-right: 6px"
            ></i>
            Logout
          </button>
        </header>
        <div
          class="property-card"
          style="border: 2px dashed var(--master); margin-top: 20px"
        >
          <h4>Register New Owner</h4>
          <div class="grid-3">
            <input type="text" id="m-own-name" placeholder="Owner Full Name" />
            <input type="text" id="m-own-id" placeholder="Create Login ID" />
            <input
              type="password"
              id="m-own-pass"
              placeholder="Create Password"
            />
          </div>
          <button
            class="btn btn-master"
            style="margin-top: 10px"
            onclick="createOwner()"
          >
            Create Owner Account
          </button>
        </div>
        <div id="owners-list"></div>
      </div>

      <div id="owner-view" class="content">
        <header
          style="margin: -25px -25px 20px -25px; background: var(--owner)"
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <i data-lucide="building-2" style="width: 24px; height: 24px"></i>
            <strong id="owner-header-title">Owner Dashboard</strong>
          </div>
          <div style="display: flex; gap: 8px">
            <button
              class="btn"
              style="background: rgba(255, 255, 255, 0.2); color: white"
              onclick="enableNotifications()"
            >
              <i
                data-lucide="bell"
                style="width: 16px; height: 16px; margin-right: 6px"
              ></i>
              Enable Notifications
            </button>
            <button
              class="btn"
              style="background: rgba(255, 255, 255, 0.2); color: white"
              onclick="location.reload()"
            >
              <i
                data-lucide="log-out"
                style="width: 16px; height: 16px; margin-right: 6px"
              ></i>
              Logout
            </button>
          </div>
        </header>
        <div
          class="property-card"
          style="
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            margin-top: 20px;
          "
        >
          <h4 style="margin-top: 0">Add New Property Unit</h4>
          <div class="form-section">Property Information</div>
          <div class="grid-3">
            <input type="text" id="new-p-name" placeholder="Property Name" />
            <input type="text" id="new-p-address" placeholder="Full Address" />
            <input type="text" id="new-p-flat" placeholder="Flat/Unit Number" />
            <input
              type="text"
              id="new-p-owner-phone"
              placeholder="Owner Mobile Number"
            />
          </div>
          <div class="form-section" style="margin-top: 15px">
            Tenant Information
          </div>
          <div class="grid-3">
            <input type="text" id="new-t-name" placeholder="Tenant Full Name" />
            <input
              type="text"
              id="new-t-id"
              placeholder="NID / Identity Number"
            />
            <input
              type="text"
              id="new-t-phone"
              placeholder="Tenant Mobile Number"
            />
            <input
              type="number"
              id="new-t-family"
              placeholder="No. of Family Members"
            />
            <input
              type="password"
              id="new-t-pass"
              placeholder="Create Tenant Password"
            />
          </div>
          <div class="form-section" style="margin-top: 15px">
            Rent Information
          </div>
          <div class="grid-3">
            <input
              type="number"
              id="new-p-rent"
              placeholder="Monthly Rent"
              oninput="calcTotal()"
            />
            <input
              type="number"
              id="new-p-service"
              placeholder="Service Charge"
              oninput="calcTotal()"
            />
            <input
              type="text"
              id="new-p-total"
              placeholder="Total Payable"
              disabled
              style="background: #e2e8f0"
            />
            <input
              type="number"
              id="new-p-advance"
              placeholder="Advance Amount"
            />
            <input type="date" id="new-p-date" />
          </div>
          <button
            class="btn btn-owner"
            style="margin-top: 10px"
            onclick="createNewProperty()"
          >
            Register Property
          </button>
        </div>
        <div id="master-list"></div>
      </div>

      <div id="tenant-view" class="content">
        <header
          style="margin: -25px -25px 20px -25px; background: var(--tenant)"
        >
          <div style="display: flex; align-items: center; gap: 12px">
            <i data-lucide="user-circle" style="width: 24px; height: 24px"></i>
            <strong id="t-header-title">Tenant Portal</strong>
          </div>
          <div style="display: flex; gap: 8px">
            <button
              class="btn"
              style="background: rgba(255, 255, 255, 0.2); color: white"
              onclick="enableNotifications()"
            >
              <i
                data-lucide="bell"
                style="width: 16px; height: 16px; margin-right: 6px"
              ></i>
              Enable Notifications
            </button>
            <button
              class="btn"
              style="background: rgba(255, 255, 255, 0.2); color: white"
              onclick="location.reload()"
            >
              <i
                data-lucide="log-out"
                style="width: 16px; height: 16px; margin-right: 6px"
              ></i>
              Logout
            </button>
          </div>
        </header>
        <div id="tenant-display"></div>
        <div id="tenant-billing-section"></div>
        <div
          class="property-card"
          style="margin-top: 20px; border-top: 4px solid var(--danger)"
        >
          <h4>🛠️ Raise Maintenance Issue</h4>
          <textarea
            id="issue-text"
            rows="2"
            placeholder="Describe the problem..."
          ></textarea>
          <button
            class="btn btn-owner"
            style="background: var(--danger)"
            onclick="submitIssue()"
          >
            Submit Request
          </button>
        </div>
        <div id="tenant-maintenance-history"></div>
      </div>

      <div id="modal">
        <div class="modal-content" id="modal-body"></div>
      </div>
    </div>

    <div id="receipt-overlay">
      <div id="receipt-content"></div>
    </div>

    <!-- Load Firebase SDK as a module -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        set,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
      import {
        getMessaging,
        getToken,
        onMessage,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js";
      import {
        getFunctions,
        httpsCallable,
      } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js";

      const firebaseConfig = window.appConfig.firebase;

      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      const messaging = getMessaging(app);
      const functions = getFunctions(app);

      // Expose to global scope for other scripts
      window.firebase = { app, database, messaging, functions };
      window.firebaseRef = ref(database, "RentMasterData");
      window.firebaseGet = get;
      window.firebaseSet = set;
      window.firebaseGetToken = getToken;
      window.firebaseOnMessage = onMessage;
      window.firebaseFunctions = functions;
      window.firebaseHttpsCallable = httpsCallable;

      console.log("Firebase initialized successfully");
    </script>

    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./js/sw.js")
            .then((registration) => {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
            })
            .catch((error) => {
              console.log("ServiceWorker registration failed: ", error);
            });
        });
      }
    </script>
  </body>
</html>
