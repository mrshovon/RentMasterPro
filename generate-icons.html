<!DOCTYPE html>
<html>
<head>
    <title>Generate PNG Icons</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .icon-preview {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #4338ca;
        }
        #icon-svg {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Generate PNG Icons from SVG</h1>
    <p>Click the buttons below to download the PNG icons:</p>
    
    <div class="icon-preview">
        <h3>192x192 Icon</h3>
        <button onclick="downloadIcon(192)">Download icon-192x192.png</button>
    </div>
    
    <div class="icon-preview">
        <h3>512x512 Icon</h3>
        <button onclick="downloadIcon(512)">Download icon-512x512.png</button>
    </div>

    <!-- SVG Source -->
    <div id="icon-svg">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
            </defs>
            <rect width="512" height="512" rx="100" fill="url(#grad1)"/>
            <path d="M256 128 L128 256 L192 256 L192 384 L320 384 L320 256 L384 256 Z" fill="white" transform="translate(0, -20)"/>
            <rect x="200" y="320" width="112" height="64" fill="white" rx="8"/>
        </svg>
    </div>

    <script>
        function downloadIcon(size) {
            const svgElement = document.querySelector('#icon-svg svg');
            const svgData = new XMLSerializer().serializeToString(svgElement);
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            const img = new Image();
            const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                URL.revokeObjectURL(url);
                
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = `icon-${size}x${size}.png`;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            
            img.src = url;
        }
    </script>
</body>
</html>
